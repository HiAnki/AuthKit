spring.application.name=project

# In-memory H2 database (swap for MySQL later by changing the datasource only)
spring.datasource.url=jdbc:h2:mem:authkit;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# AuthKit
authkit.jwt-ttl=5m
authkit.refresh-token-ttl=7d
# Browsers treat http://localhost as secure, so Secure cookies still work locally
authkit.cookie-secure=true

server.port=${PORT:8080}
