<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>AuthKit - Logged out</title>
	<style>
		body {
			margin: 0;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
			background: #f1f4f9;
			color: #1f2937;
			padding: 16px;
		}

		.card {
			width: 100%;
			max-width: 400px;
			background: #fff;
			border-radius: 12px;
			box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
			padding: 28px;
			text-align: center;
		}

		h1 {
			margin: 0 0 8px;
			font-size: 22px;
		}

		p {
			margin: 0 0 20px;
			color: #6b7280;
		}

		a {
			display: inline-block;
			padding: 12px 24px;
			border-radius: 8px;
			background: #2563eb;
			color: #fff;
			font-weight: 600;
			text-decoration: none;
		}
	</style>
</head>
<body>
	<div class="card">
		<h1>You're logged out</h1>
		<p>Your session has ended. Log in again to continue.</p>
		<a th:href="@{/auth}">Go to login</a>
	</div>
</body>
</html>
